
<div class="ezy__nav4 light py-6 bg-white text-zinc-900 relative">
  <nav>
    <div class="container mx-auto px-6 lg:px-8">
      <div class="flex items-center justify-between">
        <a class="font-black text-3xl px-6 lg:px-10" href="#">TaskTraker</a>
        <button class="block lg:hidden cursor-pointer h-10 z-30 absolute right-6 top-1/2 transform -translate-y-1/2"
          type="button" (click)="toggleMenu()" aria-label="Toggle menu">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="size-6">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3.75 5.25h16.5m-16.5 4.5h16.5m-16.5 4.5h16.5m-16.5 4.5h16.5" />
            </svg>
          </button>
          <div 
            class="flex flex-col lg:flex-row justify-center lg:justify-between items-center text-3xl gap-6 lg:text-base lg:gap-2 absolute h-screen w-screen top-0 lg:left-0 lg:relative lg:h-auto lg:w-auto bg-white lg:bg-transparent grow"
            [ngClass]="{'left-0': isMenuOpen, 'left-full': !isMenuOpen}"
            id="navbar"
          >
            <ul class="flex flex-col lg:flex-row items-center space-y-4 lg:space-y-0 lg:space-x-6">

              <li>
                <a class="flex items-center px-4 py-2 border border-black bg-white text-black font-bold hover:border-r-4 hover:border-b-4 hover:border-black" routerLink="/dashboard-institution">
                  <!-- SVG icon -->
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6 mr-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11.35 3.836c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m8.9-4.414c.376.023.75.05 1.124.08 1.131.094 1.976 1.057 1.976 2.192V16.5A2.25 2.25 0 0 1 18 18.75h-2.25m-7.5-10.5H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V18.75m-7.5-10.5h6.375c.621 0 1.125.504 1.125 1.125v9.375m-8.25-3 1.5 1.5 3-3.75" />
                  </svg>
                  Projects
                </a>
              </li>
              <li>
                <a class="flex items-center px-4 py-2 border border-black bg-white text-black font-bold hover:border-r-4 hover:border-b-4 hover:border-black" routerLink="/students">
                  <!-- SVG icon -->
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"  class="h-6 w-6 mr-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5" />
                  </svg>
                  
                  Students
                </a>
              </li>
              <li>
                <a class="flex items-center px-4 py-2 border border-black bg-white text-black font-bold hover:border-r-4 hover:border-b-4 hover:border-black" routerLink="/teachers">
                  <!-- SVG icon -->
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6 mr-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
                  </svg>
                  
                  Teachers
                </a>
              </li>
            </ul>

            <ul class="flex flex-col lg:flex-row items-center space-y-4 lg:space-y-0 lg:space-x-4 mb-2 lg:mb-0">
           
              <ng-container *ngIf="!authService.loggedIn(); else loggedIn">
                <li>
                  <button class="border border-black hover:bg-black hover:text-white rounded-lg px-4 py-1.5" routerLink="/login">
                    Login
                  </button>
                </li>
                <li>
                  <button class="border border-black hover:bg-black hover:text-white rounded-lg px-4 py-1.5" routerLink="/register">
                    Register
                  </button>
                </li>
              </ng-container>
              <ng-template #loggedIn>
                <li class="flex flex-col lg:flex-row lg:space-x-4 items-center">
                  <!-- SVG icon for user -->
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6 mb-2 lg:mb-0 lg:mr-2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                  </svg>
                  <span class="mr-4">Welcome, {{ userName }}!</span>
                  <!-- Button for logout -->
                  <button (click)="logOut()" class="bg-black text-white font-bold px-8 py-3 flex items-center border-0 mt-4 lg:mt-0">
                    Sign Out
                   
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" class="h-6 w-6 ml-2"
                      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                      <line x1="12" y1="2" x2="12" y2="12"></line>
                    </svg>
                  </button>
                </li>
              </ng-template>
            </ul>
          </div>
        </div>
      </div>
    </nav>
  </div>
